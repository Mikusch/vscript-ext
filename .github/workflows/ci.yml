name: Build Extension

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            container: ghcr.io/alliedmodders/build-containers/debian11:latest
            target: x86
            platform: linux32
          - os: ubuntu-24.04
            container: ghcr.io/alliedmodders/build-containers/debian11:latest
            target: x86_64
            platform: linux64
          - os: windows-2025
            target: x86
            platform: win32
          - os: windows-2025
            target: x86_64
            platform: win64

    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout hl2sdks
        shell: bash
        run: |
          for sdk in tf2 css hl2dm dods; do
            git clone --depth 1 --branch $sdk https://github.com/alliedmodders/hl2sdk cache/hl2sdk-$sdk
          done

      - name: Checkout AMBuild
        uses: actions/checkout@v6
        with:
          repository: alliedmodders/ambuild
          ref: master
          path: cache/ambuild
          fetch-depth: 1

      - name: Checkout SourceMod
        uses: actions/checkout@v6
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: cache/sourcemod
          submodules: recursive
          fetch-depth: 1

      - name: Checkout Metamod:Source
        uses: actions/checkout@v6
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: cache/metamod-source
          submodules: recursive
          fetch-depth: 1

      - name: Install AMBuild
        run: pip3 install ./cache/ambuild

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
            export CXX="${{ matrix.cxx }}"
          fi
          git config --global --add safe.directory "$(pwd)"
          mkdir -p build && cd build
          python3 ../configure.py \
            --sdk=tf2,css,hl2dm,dods \
            --mms-path="../cache/metamod-source" \
            --sm-path="../cache/sourcemod" \
            --sdk-root="../cache" \
            --enable-optimize \
            --enable-auto-versioning \
            --targets ${{ matrix.target }}
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VScript-${{ matrix.platform }}
          path: build/package

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for version change
        id: version
        run: |
          version=$(cat product.version | tr -d '[:space:]')
          if gh release view "$version" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "tag=$version" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v8

      - name: Package
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir VScript-linux VScript-windows
          cp -r VScript-linux32/* VScript-linux/
          cp -r VScript-linux64/* VScript-linux/
          cp -r VScript-win32/* VScript-windows/
          cp -r VScript-win64/* VScript-windows/
          cd VScript-linux && tar -czf ../VScript-linux.tar.gz .
          cd ../VScript-windows && zip -r ../VScript-windows.zip .

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          VScript-linux.tar.gz
          VScript-windows.zip
          --generate-notes
          --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
